<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Records — Attendance Alert System</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">📋 Attendance Alert System</span>
    <nav></nav>
    <span class="spacer"></span>
    <div class="user-box" id="userBox"></div>
  </header>

  <main class="container">
    <div class="page-header">
      <div>
        <h1>Attendance Records</h1>
        <div class="subtitle">Browse, search and filter every attendance entry</div>
      </div>
      <button class="btn btn-secondary" id="exportBtn">Export to Excel</button>
    </div>

    <div class="card mb-2">
      <div class="filters" style="margin-bottom:0">
        <div class="field">
          <label for="search">Search</label>
          <input type="text" id="search" placeholder="Roll no or student name…" />
        </div>
        <div class="field">
          <label for="subject">Subject</label>
          <select id="subject"><option value="">All subjects</option></select>
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status">
            <option value="">All</option>
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
          </select>
        </div>
        <div class="field">
          <label for="startDate">From</label>
          <input type="date" id="startDate" />
        </div>
        <div class="field">
          <label for="endDate">To</label>
          <input type="date" id="endDate" />
        </div>
        <button class="btn btn-primary" id="applyBtn">Apply</button>
        <button class="btn btn-secondary" id="resetBtn">Reset</button>
      </div>
    </div>

    <div class="alert alert-error hidden" id="tableAlert"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Roll No</th><th>Student</th><th>Subject</th><th>Date</th>
            <th>Lecture</th><th>Time</th><th>Attendance</th><th></th>
          </tr>
        </thead>
        <tbody id="recordsBody">
          <tr><td colspan="8" class="loading">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/attendance.js"></script>
</body>
</html>
