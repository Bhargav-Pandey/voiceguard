<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Today's Absentees — Attendance Alert System</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">📋 Attendance Alert System</span>
    <nav></nav>
    <span class="spacer"></span>
    <div class="user-box" id="userBox"></div>
  </header>

  <main class="container">
    <div class="page-header">
      <div>
        <h1>Absentees</h1>
        <div class="subtitle" id="subtitle">Select a date to see absent students and notification status</div>
      </div>
    </div>

    <div class="card mb-2">
      <div class="filters" style="margin-bottom:0">
        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" />
        </div>
        <div class="field">
          <label for="subject">Subject</label>
          <select id="subject"><option value="">All subjects</option></select>
        </div>
        <button class="btn btn-primary" id="loadBtn">Load</button>
      </div>
    </div>

    <div class="alert alert-error hidden" id="tableAlert"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Roll No</th><th>Student Name</th><th>Subject</th><th>Date</th>
            <th>Lecture</th><th>Parent</th><th>Notification</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="absenteesBody">
          <tr><td colspan="8" class="loading">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/absentees.js"></script>
</body>
</html>
